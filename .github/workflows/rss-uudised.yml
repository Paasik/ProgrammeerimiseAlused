
name: VarskedUudised - RSS veebileht

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

  push:
    branches:
      - main
    paths:
      - "VarskedUudised/**"
      - ".github/workflows/rss-uudised.yml"

permissions:
  contents: read

concurrency:
  group: rss-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Laadi GitHubi projekt
        uses: actions/checkout@v4

      - name: Paigalda .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Taasta eelmine arhiiv
        run: |
          mkdir -p VarskedUudised/RSS_voogude_agregaator/bin/Release/net10.0

          curl --fail --location --silent --show-error --max-time 20 \
            -o VarskedUudised/RSS_voogude_agregaator/bin/Release/net10.0/arhiiv.json \
            "https://paasik.github.io/ProgrammeerimiseAlused/VarskedUudised/arhiiv.json" \
            || rm -f VarskedUudised/RSS_voogude_agregaator/bin/Release/net10.0/arhiiv.json

      - name: Kaivita RSS agregaator
        run: |
          dotnet run --configuration Release --project VarskedUudised/RSS_voogude_agregaator/RSS_voogude_agregaator.csproj

      - name: Valmista veebileht ette
        run: |
          OUTPUT="VarskedUudised/RSS_voogude_agregaator/bin/Release/net10.0"
          DEST="veebileht/VarskedUudised"

          mkdir -p "$DEST"

          cp "$OUTPUT/uudised.html" "$DEST/index.html"
          cp "$OUTPUT/arhiiv.json" "$DEST/arhiiv.json"

          cp -R "$OUTPUT/wwwroot" "$DEST/wwwroot"

          test -f "$DEST/wwwroot/style.css"
          test -f "$DEST/wwwroot/site.js"

          touch veebileht/.nojekyll

          cat > veebileht/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="et">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=./VarskedUudised/">
            <title>Värsked Uudised</title>
          </head>
          <body>
            <p>
              Ava <a href="./VarskedUudised/">Värsked Uudised</a>.
            </p>
          </body>
          </html>
          EOF

      - name: Seadista GitHub Pages
        uses: actions/configure-pages@v5

      - name: Laadi veebileht ules
        uses: actions/upload-pages-artifact@v4
        with:
          path: veebileht

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Avalda veebileht
        id: deployment
        uses: actions/deploy-pages@v4
